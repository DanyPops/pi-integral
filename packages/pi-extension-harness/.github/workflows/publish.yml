name: Publish Package

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the
# OIDC environment automatically (requires npm >= 11.5.1). Configure the
# trusted publisher on npmjs.com: org=DanyPops repo=pi-extension-harness
# workflow=publish.yml -- a one-time, manual, npmjs.com-website-only step
# that must be done before the first tag push can succeed (ENEEDAUTH
# otherwise, not a silent skip).

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run lint:ci
      - run: bun x tsc --noEmit
      - run: bun run build
      - run: bun test test

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm install -g npm@latest && npm --version

      - run: npm publish --access public
