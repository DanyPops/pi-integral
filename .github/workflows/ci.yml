name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # pi-process-harness spawns a real `pi` binary on PATH -- never previously exercised in CI
      # at all (this package had no remote/CI configured before joining this monorepo).
      - run: bun add --global @earendil-works/pi-coding-agent
      # process-support is a real runtime dependency of pi-process-harness, resolved via its
      # dist/ build output -- must exist before anything that imports it can test or typecheck.
      - run: bun run build
      - run: bun test
      - run: bun run typecheck
