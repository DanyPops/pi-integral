name: Publish packages

on:
  push:
    tags:
      - "pi-process-harness-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish-pi-process-harness:
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/pi-process-harness
      tag-prefix: pi-process-harness-v
      package-manager: bun
      lint-command: bunx biome ci packages/pi-process-harness/src packages/pi-process-harness/test
      test-command: bun run --cwd packages/pi-process-harness test
      typecheck-command: bun run --cwd packages/pi-process-harness typecheck
