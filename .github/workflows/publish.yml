name: Publish packages

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the OIDC environment
# automatically (requires npm >= 11.5.1). Every package's npm trusted publisher must name
# org=DanyPops, repo=pi-integral, workflow=publish.yml. This is a manual npmjs.com step; the
# workflow cannot configure it. A package that has never been published must also be created
# before its first tag push, or publishing fails with ENEEDAUTH.

on:
  push:
    tags:
      - "pi-extension-harness-v*"
      - "pi-process-harness-v*"
      - "pi-rpc-protocol-v*"
      - "pi-tui-harness-v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: package
        name: Match tag to package version
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            pi-extension-harness-v*)
              package_dir="packages/pi-extension-harness"
              tag_version="${GITHUB_REF_NAME#pi-extension-harness-v}"
              ;;
            pi-process-harness-v*)
              package_dir="packages/pi-process-harness"
              tag_version="${GITHUB_REF_NAME#pi-process-harness-v}"
              ;;
            pi-rpc-protocol-v*)
              package_dir="packages/pi-rpc-protocol"
              tag_version="${GITHUB_REF_NAME#pi-rpc-protocol-v}"
              ;;
            pi-tui-harness-v*)
              package_dir="packages/pi-tui-harness"
              tag_version="${GITHUB_REF_NAME#pi-tui-harness-v}"
              ;;
            *)
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          package_version="$(node -p "require('./$package_dir/package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match $package_dir version $package_version" >&2
            exit 1
          fi
          echo "dir=$package_dir" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # pi-process-harness spawns a real `pi` binary on PATH.
      - run: bun add --global @earendil-works/pi-coding-agent
      - run: bun run lint
      - run: bun run build
      - run: bun run typecheck
      - run: bun test

      - name: Build the tagged package
        working-directory: ${{ steps.package.outputs.dir }}
        run: bun run build

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1). NO registry-url
      # here: it makes setup-node write an .npmrc with an empty NODE_AUTH_TOKEN line, which
      # shadows OIDC auto-detection and breaks trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm install -g npm@latest && npm --version

      - name: Publish
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm publish --access public
