name: Publish packages

on:
  push:
    tags:
      - "pi-extension-harness-v*"
      - "pi-process-harness-v*"
      - "pi-rpc-protocol-v*"
      - "pi-tui-harness-v*"
      - "pi-eval-harness-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish-pi-extension-harness:
    if: startsWith(github.ref_name, 'pi-extension-harness-v')
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/pi-extension-harness
      tag-prefix: pi-extension-harness-v
      package-manager: bun
      install-command: bun install --frozen-lockfile && bun add --global @earendil-works/pi-coding-agent
      lint-command: bun run lint
      typecheck-command: bun run typecheck
      build-command: bun run build

  publish-pi-process-harness:
    if: startsWith(github.ref_name, 'pi-process-harness-v')
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/pi-process-harness
      tag-prefix: pi-process-harness-v
      package-manager: bun
      install-command: bun install --frozen-lockfile && bun add --global @earendil-works/pi-coding-agent
      lint-command: bun run lint
      # A workspace consumer imports this package through its built dist export during the root test run.
      test-command: bun run build && bun test
      typecheck-command: bun run typecheck
      build-command: bun run build

  publish-pi-rpc-protocol:
    if: startsWith(github.ref_name, 'pi-rpc-protocol-v')
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/pi-rpc-protocol
      tag-prefix: pi-rpc-protocol-v
      package-manager: bun
      install-command: bun install --frozen-lockfile && bun add --global @earendil-works/pi-coding-agent
      lint-command: bun run lint
      test-command: bun test
      typecheck-command: bun run typecheck
      build-command: bun run build

  publish-pi-tui-harness:
    if: startsWith(github.ref_name, 'pi-tui-harness-v')
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/pi-tui-harness
      tag-prefix: pi-tui-harness-v
      package-manager: bun
      install-command: bun install --frozen-lockfile && bun add --global @earendil-works/pi-coding-agent
      lint-command: bun run lint
      test-command: bun test
      typecheck-command: bun run typecheck
      build-command: bun run build

  publish-pi-eval-harness:
    if: startsWith(github.ref_name, 'pi-eval-harness-v')
    uses: DanyPops/vehicle/.github/workflows/reusable-npm-publish.yml@main
    with:
      package-directory: packages/pi-eval-harness
      tag-prefix: pi-eval-harness-v
      package-manager: bun
      install-command: bun install --frozen-lockfile && bun add --global @earendil-works/pi-coding-agent
      lint-command: bun run lint
      # pi-eval-harness's own tests import @danypops/pi-process-harness by its published package
      # name (resolved via workspace symlink to that sibling's dist/), not by relative source path
      # -- unlike every other package here, its tests need a workspace-wide build before the Test
      # step runs, not only its own build-command (which the reusable workflow only runs after).
      test-command: bun run build && bun test
      typecheck-command: bun run typecheck
      build-command: bun run build
